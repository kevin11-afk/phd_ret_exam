<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — PhD Entrance Examination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <img src="/static/img/logo.png" alt="University Logo" class="university-logo" style="height: 64px; margin: 0 auto;" onerror="this.style.display='none'">
      </div>
      <div class="eyebrow">PhD Entrance Examination</div>
      <h1>Secure login</h1>
      <p class="sub">Sign in with the credentials issued by your department.</p>

      <div class="form-error" id="loginError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">Sign in</button>
      </form>

      <p class="form-hint" style="margin-top:14px;">
        <a href="#" id="forgotLink">Forgot your password?</a>
      </p>
      <div class="form-error" id="forgotMessage" style="background: var(--panel-raised); border-color: var(--border); color: var(--text-muted); margin-top:10px;"></div>

      <p class="form-hint">
        First time signing in? Use the temporary password issued to you —
        you'll be asked to set a new one before you continue.
      </p>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
